upstream client {
  server client:3000;
}

upstream server {
  server server:3001;
}

server {
  listen 80;
  server_name _;

  # ── API & Socket.io → backend ──
  location /api/ {
    proxy_pass http://server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://server;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400;
  }

  # ── Static asset caching (SvelteKit immutable build output) ──
  location /_app/immutable/ {
    proxy_pass http://client;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # ── Sprite / static asset caching ──
  # Browser-side: since sprites are fetched from GitHub raw URLs directly,
  # the browser caches them naturally. This block covers any locally-served
  # static assets (icons, CSS, images).
  location /sprites/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location ~* \.(png|gif|jpg|jpeg|svg|ico|webp|woff2?|ttf|eot|css|js)$ {
    proxy_pass http://client;
    expires 7d;
    add_header Cache-Control "public";
  }

  # ── Everything else → SvelteKit client ──
  location / {
    proxy_pass http://client;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket support for HMR in dev
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
