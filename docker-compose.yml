version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pokeserver
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/pokeserver?schema=public
      JWT_SECRET: super-secret-change-me-in-production
      PORT: 3001
      CLIENT_URL: http://localhost
      INVITE_CODE: ''
      MAX_USERS: 20

  client:
    build:
      context: ./client
      args:
        VITE_SERVER_URL: ''
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      HOST: 0.0.0.0

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - client
      - server
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
