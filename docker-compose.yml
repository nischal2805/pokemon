version: '3.8'

services:
  server:
    build: ./server
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      CLIENT_URL: https://${DOMAIN}
      INVITE_CODE: ${INVITE_CODE}
      MAX_USERS: ${MAX_USERS:-20}
      DB_DIR: /data
    volumes:
      - sqlite-data:/data

  client:
    build:
      context: ./client
      args:
        VITE_SERVER_URL: ''
    restart: unless-stopped
    depends_on:
      - server
    environment:
      PORT: 3000
      HOST: 0.0.0.0

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - client
      - server
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    environment:
      DOMAIN: ${DOMAIN}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d

volumes:
  sqlite-data:
  certbot-www:
